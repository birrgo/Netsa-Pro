name: Build Netsa Pro Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Netsa Pro"
  PACKAGE_NAME: "com.netsapro.app"
  # Replace with your actual AdMob App ID or move to GitHub Secrets
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713" 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Esbuild
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          # Included @capacitor/app to handle the Android hardware back button natively
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/splash-screen@8 @capacitor/app@8 capacitor-admob-nextgen@1.2.9 @onesignal/capacitor-plugin esbuild

      - name: Initialize AdMob SDK Variables
        run: |
          node -e "
          const fs = require('fs');
          let pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.admob = {
            androidAppId: '${{ env.ADMOB_APP_ID }}',
            enableNativeAds: { android: true } 
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          rm -rf www
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/

          echo "import { Capacitor } from '@capacitor/core';" > bridge.js
          echo "import { AdMobNextGen } from 'capacitor-admob-nextgen';" >> bridge.js
          echo "import OneSignalPlugin from '@onesignal/capacitor-plugin';" >> bridge.js
          echo "window.Capacitor = Capacitor;" >> bridge.js
          echo "window.AdMobPlugin = AdMobNextGen;" >> bridge.js
          echo "window.OneSignal = OneSignalPlugin.default || OneSignalPlugin;" >> bridge.js

          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ env.PACKAGE_NAME }}",
            "appName": "${{ env.APP_NAME }}",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          
          # Run AdMob manifest injectors
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js; fi
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-native.js; fi
          
          # Add Notification Permission
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Inject Custom Notification Layout and Native Code
        run: |
          # 1. Add OneSignal Dependency
          sed -i '/dependencies {/a \    compileOnly "com.onesignal:OneSignal:5.1.8"' android/app/build.gradle

          # 2. Generate XML layout file
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/custom_heads_up_notification.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="0dp"
              android:background="#000000">
              <ImageView
                  android:id="@+id/img_main"
                  android:layout_width="match_parent"
                  android:layout_height="140dp"
                  android:scaleType="centerCrop"
                  android:adjustViewBounds="true" />
          </LinearLayout>
          EOF

          # 3. Generate Java Service File (Updated package to com.netsapro.app)
          mkdir -p android/app/src/main/java/com/netsapro/app
          cat << 'EOF' > android/app/src/main/java/com/netsapro/app/CustomNotificationService.java
          package com.netsapro.app; 
          
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          
          import com.onesignal.notifications.INotificationReceivedEvent;
          import com.onesignal.notifications.INotificationServiceExtension;
          import com.onesignal.notifications.IMutableNotification;
          
          import java.io.InputStream;
          import java.net.URL;

          public class CustomNotificationService implements INotificationServiceExtension {
              @Override
              public void onNotificationReceived(INotificationReceivedEvent event) {
                  Context context = event.getContext();
                  IMutableNotification mutableNotification = event.getNotification();

                  String customImgUrl = null;
                  if (mutableNotification.getAdditionalData() != null) {
                      customImgUrl = mutableNotification.getAdditionalData().optString("custom_heads_up_image", null);
                  }

                  if (customImgUrl != null) {
                      try {
                          InputStream in = new URL(customImgUrl).openStream();
                          final Bitmap bitmap = BitmapFactory.decodeStream(in);

                          mutableNotification.setExtender(builder -> {
                              RemoteViews customView = new RemoteViews(context.getPackageName(), R.layout.custom_heads_up_notification);
                              customView.setImageViewBitmap(R.id.img_main, bitmap);
                              builder.setCustomHeadsUpContentView(customView);
                              builder.setStyle(new NotificationCompat.DecoratedCustomViewStyle());
                              return builder;
                          });
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }
          }
          EOF

          # 4. Register Java extension in AndroidManifest.xml
          sed -i '/<\/application>/i \        <meta-data android:name="com.onesignal.NotificationServiceExtension" android:value="com.netsapro.app.CustomNotificationService" />' android/app/src/main/AndroidManifest.xml

      - name: Add Google Services JSON
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Set Custom App and Notification Icons
        run: |
          mkdir -p android/app/src/main/res/drawable
          if [ -f s2.png ]; then
            cp s2.png android/app/src/main/res/drawable/ic_stat_onesignal_default.png
            cp s2.png android/app/src/main/res/drawable/ic_onesignal_large_icon_default.png
          fi

          if [ -f s.png ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
              cp s.png android/app/src/main/res/$dir/ic_launcher.png
              cp s.png android/app/src/main/res/$dir/ic_launcher_round.png
              cp s.png android/app/src/main/res/$dir/ic_launcher_foreground.png
            done
          fi

      - name: Update Android Variables (API 36 & Versioning)
        run: |
          # Patching variables.gradle is safer than replacing directly in build.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" android/variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" android/variables.gradle
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" android/variables.gradle
          sed -i "s/versionName = .*/versionName = '1.0.${{ github.run_number }}'/" android/variables.gradle

      - name: Decode Base64 Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Build Signed Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          # Passes signing properties directly to Gradle, avoiding build.gradle corruption
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Move & Rename AAB Output
        run: mv android/app/build/outputs/bundle/release/app-release.aab netsa-pro.aab

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netsa-pro-aab
          path: netsa-pro.aab
